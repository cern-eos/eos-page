<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EOS Open Storage</title>
  <meta name="description" content="EOS is CERN's open-source storage system for LHC analysis, CERNBox, and CTA tape workflows." />
  <link rel="icon" href="/static/media/eos-icon-white.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css?v=tick11" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/" data-nav>
      <img class="logo" src="/static/media/eos-logo.png" alt="EOS" />
      <em>Open Storage</em>
    </a>
    <button type="button" class="menu-toggle" data-menu="toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav" id="site-nav">
      <a class="nav-home" href="/" data-nav title="Home" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.4 11.2 12 4.2l7.6 7"/><path d="M6.6 10.4V20h10.8v-9.6"/></svg>
      </a>
      <a href="/about" data-nav>About</a>
      <a href="/tech" data-nav>Tech</a>
      <a href="/roadmap" data-nav>Roadmap</a>
      <a href="/docs" data-nav>Docs</a>
      <a href="/workshops" data-nav>Workshops</a>
      <a href="/search" data-nav>Search talks</a>
      <a href="/resources" data-nav>Resources</a>
      <a href="/service" data-nav>Service</a>
      <a href="/news" data-nav>News</a>
      <a href="/community" data-nav>Community/Support</a>
    </nav>
    <div class="repo-links">
      <a class="repo-btn" id="repo-gitlab" href="https://gitlab.cern.ch/dss/eos" target="_blank" rel="noreferrer">
        <img src="/static/media/gitlab-logo.svg" alt="" />
        <span>GitLab</span>
      </a>
      <a class="repo-btn" id="repo-github" href="https://github.com/cern-eos/eos" target="_blank" rel="noreferrer">
        <img src="/static/media/github-mark-white.svg" alt="" />
        <span>GitHub</span>
      </a>
    </div>
    <a class="cern-logo" href="https://home.cern" target="_blank" rel="noreferrer" title="CERN">
      <img src="/static/media/cern-logo-white.svg" alt="CERN" />
    </a>
  </header>
  <div class="page-stage">
    <main id="app"></main>
  </div>
  <footer class="foot">
    <div class="wrap foot-grid">
      <div>
        <a class="cern-logo foot-cern" href="https://home.cern" target="_blank" rel="noreferrer" title="CERN">
          <img src="/static/media/cern-logo-white.svg" alt="CERN" />
        </a>
        <p class="brand-mini">EOS Open Storage</p>
        <p class="muted" id="foot-address"></p>
        <p><a id="foot-mail" href="mailto:eos-support@cern.ch">eos-support@cern.ch</a></p>
      </div>
      <form id="news-form" class="news">
        <label for="news-email">EOS announcements</label>
        <div class="news-row">
          <input id="news-email" type="email" required autocomplete="email" placeholder="Email" />
          <button type="submit">Subscribe</button>
        </div>
        <p id="news-msg" class="muted" hidden></p>
      </form>
      <p class="legal">© CERN · <a href="/" data-nav>Home</a></p>
    </div>
  </footer>
  <div class="docs-viewer" hidden>
    <div class="docs-viewer-backdrop" data-docs-close></div>
    <div class="docs-viewer-panel" role="dialog" aria-modal="true" aria-labelledby="docs-viewer-title">
      <header class="docs-viewer-head">
        <button type="button" class="docs-viewer-back" data-docs-back hidden>Back</button>
        <div class="docs-viewer-heading">
          <span>EOS documentation</span>
          <strong id="docs-viewer-title" data-docs-title>Documentation</strong>
        </div>
        <a class="docs-viewer-orig" data-docs-orig href="https://eos-docs.web.cern.ch/diopside/" target="_blank" rel="noreferrer">Open original</a>
        <button type="button" class="docs-viewer-x" data-docs-close aria-label="Close documentation">×</button>
      </header>
      <nav class="docs-viewer-pager">
        <a class="docs-viewer-prev" data-docs-prev hidden></a>
        <a class="docs-viewer-next" data-docs-next hidden></a>
      </nav>
      <div class="docs-viewer-body" data-docs-body></div>
    </div>
  </div>
  <aside class="eos-chat" id="eos-chat">
    <div class="eos-chat-panel" id="eos-chat-panel">
      <header class="eos-chat-head">
        <img class="eos-chat-logo" src="/static/media/eos-logo.png" alt="" />
        <div>
          <strong>Ask EOS</strong>
          <p>Ask EOS · live web search</p>
        </div>
        <span class="eos-chat-bot" aria-hidden="true">
          <svg viewBox="0 0 36 40">
            <g fill="none" stroke="#f4f4f4" stroke-width="1.4" stroke-linecap="round">
              <rect x="10" y="21" width="16" height="13.2" rx="3.6" fill="#f4f4f4" stroke="none"/>
              <circle cx="18" cy="13.2" r="7.4" fill="#f4f4f4" stroke="none"/>
              <line x1="18" y1="5.8" x2="18" y2="3"/>
              <circle cx="18" cy="2.2" r="1.35" fill="var(--orange)" stroke="none"/>
              <circle cx="15.3" cy="12.4" r="1.15" fill="#111" stroke="none"/>
              <circle cx="20.7" cy="12.4" r="1.15" fill="#111" stroke="none"/>
              <path d="M15.5 15.6c1.5 1.3 3.5 1.3 5 0" stroke="#111" stroke-width="1.15"/>
              <line x1="10" y1="26.2" x2="6.4" y2="29.4" stroke="#f4f4f4" stroke-width="1.8"/>
            </g>
            <g class="eos-bot-arm">
              <path d="M26 24.2c3.6-.4 5.8-3.6 5.2-7.1" fill="none" stroke="#f4f4f4" stroke-width="1.8" stroke-linecap="round"/>
              <circle cx="30.8" cy="16.2" r="1.55" fill="var(--orange)"/>
            </g>
          </svg>
        </span>
        <span class="eos-chat-ai" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.2v3.1M12 17.7v3.1M3.2 12h3.1M17.7 12h3.1M6.1 6.1l2.2 2.2M15.7 15.7l2.2 2.2M17.9 6.1l-2.2 2.2M8.3 15.7l-2.2 2.2"/><circle cx="12" cy="12" r="3.1"/></svg>
        </span>
        <div class="eos-chat-tools">
          <button type="button" class="eos-chat-tool" data-chat-clear aria-label="Clear chat" title="Clear">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V5.2A1.2 1.2 0 0 1 10.2 4h3.6A1.2 1.2 0 0 1 15 5.2V7M7 7l.8 12.2A1.4 1.4 0 0 0 9.2 20.5h5.6a1.4 1.4 0 0 0 1.4-1.3L17 7"/></svg>
          </button>
          <button type="button" class="eos-chat-tool" data-chat-grow aria-label="Enlarge chat" aria-pressed="false" title="Enlarge">
            <svg class="eos-chat-grow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/></svg>
            <svg class="eos-chat-shrink-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M4 15h5v5M20 15h-5v5"/></svg>
          </button>
          <button type="button" class="eos-chat-x" data-chat-close aria-label="Close chat">×</button>
        </div>
      </header>
      <div class="eos-chat-log" id="eos-chat-log">
        <p class="eos-chat-hello">Ask about EOS, CERNBox, CTA, docs or workshops.</p>
      </div>
      <form class="eos-chat-form" id="eos-chat-form">
        <textarea name="q" required maxlength="1200" rows="2" placeholder="Ask about EOS…" aria-label="Question"></textarea>
        <button type="submit" class="eos-chat-send" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </form>
    </div>
    <button type="button" class="eos-chat-toggle" id="eos-chat-toggle" aria-expanded="false" aria-controls="eos-chat-panel">
      <span class="eos-chat-bot" aria-hidden="true">
        <svg viewBox="0 0 36 40">
          <g fill="none" stroke="#f4f4f4" stroke-width="1.4" stroke-linecap="round">
            <rect x="10" y="21" width="16" height="13.2" rx="3.6" fill="#f4f4f4" stroke="none"/>
            <circle cx="18" cy="13.2" r="7.4" fill="#f4f4f4" stroke="none"/>
            <line x1="18" y1="5.8" x2="18" y2="3"/>
            <circle cx="18" cy="2.2" r="1.35" fill="var(--orange)" stroke="none"/>
            <circle cx="15.3" cy="12.4" r="1.15" fill="#111" stroke="none"/>
            <circle cx="20.7" cy="12.4" r="1.15" fill="#111" stroke="none"/>
            <path d="M15.5 15.6c1.5 1.3 3.5 1.3 5 0" stroke="#111" stroke-width="1.15"/>
            <line x1="10" y1="26.2" x2="6.4" y2="29.4" stroke="#f4f4f4" stroke-width="1.8"/>
          </g>
          <g class="eos-bot-arm">
            <path d="M26 24.2c3.6-.4 5.8-3.6 5.2-7.1" fill="none" stroke="#f4f4f4" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="30.8" cy="16.2" r="1.55" fill="var(--orange)"/>
          </g>
        </svg>
      </span>
      <img class="eos-chat-logo" src="/static/media/eos-logo.png" alt="" />
      <span>Ask EOS</span>
      <span class="eos-chat-ai" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.2v3.1M12 17.7v3.1M3.2 12h3.1M17.7 12h3.1M6.1 6.1l2.2 2.2M15.7 15.7l2.2 2.2M17.9 6.1l-2.2 2.2M8.3 15.7l-2.2 2.2"/><circle cx="12" cy="12" r="3.1"/></svg>
      </span>
    </button>
  </aside>
  <script src="/static/app.js?v=forumup"></script>
</body>
</html>
